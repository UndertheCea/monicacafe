version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule: { interval: weekly }
    groups:
      go-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly }
    groups:
      e2e-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/backend, /frontend, /scripts]
    schedule: { interval: weekly }
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
  # Covers the image: lines in docker-compose.yml
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    # A new major of a stateful service can't start on the old one's data volume
    # (Postgres needs dump + restore and a matching pg_dump in scripts/backup.Dockerfile;
    # Meilisearch needs a dump / import). CI starts from an empty volume, so it can't
    # catch this: majors are upgraded by hand, see docs/DEPLOY.md (#317).
    ignore:
      - dependency-name: postgres
        update-types: [version-update:semver-major]
      - dependency-name: redis
        update-types: [version-update:semver-major]
      - dependency-name: getmeili/meilisearch
        update-types: [version-update:semver-major]
    groups:
      compose-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
