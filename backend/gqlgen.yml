schema:
  - graph/schema.graphqls

exec:
  filename: graph/generated/generated.go
  package: generated

model:
  filename: graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: graph
  package: graph
  filename_template: "{name}.resolvers.go"

models:
  Time:
    model: github.com/99designs/gqlgen/graphql.Time
  TWD:
    model: github.com/underthecea/monicacafe/backend/internal/platform/money.TWD
  # Nested fields that need a per-parent query get field resolvers.
  # Coffee.shop and Comment.user are populated eagerly via JOIN instead.
  Shop:
    fields:
      coffees:
        resolver: true
  Coffee:
    fields:
      variants:
        resolver: true
      comments:
        resolver: true
      commentCount:
        resolver: true
  User:
    fields:
      shop:
        resolver: true
