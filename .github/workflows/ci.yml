name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (go build / vet / test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: monica
          POSTGRES_PASSWORD: monica_secret
          POSTGRES_DB: monicacafe
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U monica -d monicacafe"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: monica_secret
      TEST_DATABASE_URL: postgres://monica:monica_secret@localhost:5432/monicacafe?sslmode=disable
      TEST_S3_ENDPOINT: http://localhost:8333
      TEST_S3_BUCKET: media
      TEST_S3_ACCESS_KEY: monica_s3
      TEST_S3_SECRET_KEY: monica_s3_secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # Same script compose runs (#209); its self-test covers a re-run, the
      # upgrade of a database made before schema_migrations, and a failing migration.
      - name: Apply migrations + demo seed
        working-directory: .
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" ./scripts/migrate.sh
          psql -v ON_ERROR_STOP=1 -h localhost -U monica -d monicacafe -f scripts/seed_dev.sql
      - name: Migration runner self-test
        working-directory: .
        run: DATABASE_URL="$TEST_DATABASE_URL" ./scripts/migrate_selftest.sh
      # Reference shops (#169): load the (dev-only) seed, run its self-test
      # (fixture coffees: matching, skips, the gap view), then remove it all and
      # check nothing is left before the integration tests use the database.
      - name: Reference-shop seed, self-test and removal
        working-directory: .
        run: |
          db="postgres://monica:monica_secret@localhost:5432/monicacafe"
          psql -v ON_ERROR_STOP=1 "$db" -f scripts/seed_reference.sql
          DATABASE_URL="$db" ./scripts/reference_gaps.sh --strict
          psql -v ON_ERROR_STOP=1 "$db" -f scripts/reference_selftest.sql
          DATABASE_URL="$db" ./scripts/reference_gaps.sh
          psql -v ON_ERROR_STOP=1 "$db" -f scripts/remove_reference_shops.sql
          left=$(psql "$db" -XAtc "SELECT (SELECT count(*) FROM users WHERE email LIKE 'reference+%') + (SELECT count(*) FROM shops WHERE slug LIKE 'ref-%') + (to_regclass('reference_catalogue') IS NOT NULL)::int")
          test "$left" = "0" || { echo "remove_reference_shops.sql left $left things behind"; exit 1; }
      # Same image + script as docker-compose.yml, so the upload integration
      # test PUTs a real file with a presigned URL and reads it back anonymously.
      - name: Start SeaweedFS (S3) + create the image bucket
        working-directory: .
        run: |
          docker run -d --name seaweedfs -p 8333:8333 \
            -e S3_BUCKET=media -e S3_ACCESS_KEY=monica_s3 -e S3_SECRET_KEY=monica_s3_secret \
            -v "$PWD/scripts/seaweedfs.sh:/seaweedfs.sh:ro" \
            --entrypoint /bin/sh chrislusf/seaweedfs:4.52 /seaweedfs.sh start
          for i in $(seq 60); do curl -sf http://localhost:8333/healthz >/dev/null && break; sleep 1; done
          docker exec -e S3_BUCKET=media -e SEAWEED_HOST=localhost seaweedfs /bin/sh /seaweedfs.sh init
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go build ./...
      - run: go vet ./...
      - name: go test (unit + integration)
        run: go test -race -count=1 ./...
      - name: SeaweedFS logs (on failure)
        if: failure()
        run: docker logs seaweedfs 2>&1 | tail -100

  frontend:
    name: Frontend (npm ci / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Same install command as frontend/Dockerfile, so a stale lockfile fails here first.
      # Plain `npm ci` (no --legacy-peer-deps): verified in #216 that the peer tree resolves.
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build

  security:
    name: Security (govulncheck + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # Fails when a known vulnerability is reachable from our code (Go stdlib or modules).
      - name: govulncheck
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Production dependencies only; high and critical advisories fail the build.
      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev

  compose:
    name: compose config + docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: cp .env.example .env && docker compose config --quiet && docker compose --profile prod --profile cache --profile search config --quiet
      - name: Project brief stays short and structured
        run: ./scripts/check_brief.sh

  stack:
    name: Full stack (docker compose up + smoke.sh through nginx)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build and start every service
        run: |
          cp .env.example .env
          sed -i "s/^SEED_REFERENCE_SHOPS=.*/SEED_REFERENCE_SHOPS=true/" .env  # dev-only reference shops (#169)
          docker compose up --build -d --wait --wait-timeout 300
      - name: Smoke test via http://localhost
        run: ./scripts/smoke.sh
      # The migrate service runs on every start: running it again must find the
      # database up to date.
      - name: Migrations re-run on an existing volume
        run: |
          out=$(docker compose run --rm migrate 2>&1); echo "$out"
          grep -q "up to date" <<<"$out" || { echo "migrate didn't report up to date"; exit 1; }
      # Restore drill (#220): back the database up with the same image the
      # `backup` service uses (pg_dump 17), wipe it, restore, and smoke again.
      - name: Backup, wipe and restore the database, then smoke again
        run: |
          run_backup() {
            docker compose run --rm --no-deps -e BACKUP_TARGET=/backups -e BACKUP_ALLOW_PLAINTEXT=true \
              backup sh -c "$1"
          }
          run_backup 'sh /monicacafe/scripts/backup.sh'
          docker compose stop nginx frontend backend
          docker compose exec -T postgres sh -c 'psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"'
          run_backup 'sh /monicacafe/scripts/restore.sh "/backups/$(ls /backups | sort | tail -n 1)"'
          docker compose up -d --wait --wait-timeout 300
          ./scripts/smoke.sh
      - name: Reference-shop gap report
        run: ./scripts/reference_gaps.sh
      - name: Service status and logs (on failure)
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=80
      - name: Tear down
        if: always()
        run: docker compose down -v
