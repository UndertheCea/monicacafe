# Moni Cafe — local stack. `docker compose up --build`, then open http://localhost
#
# Every value below has a safe *development* default; override any of them by
# copying .env.example to .env (compose reads it automatically).

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-monica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monica_secret}
      POSTGRES_DB: ${POSTGRES_DB:-monicacafe}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      # initdb.sh refuses the demo / reference seeds when this is production.
      APP_ENV: ${APP_ENV:-development}
      SEED_REFERENCE_SHOPS: ${SEED_REFERENCE_SHOPS:-false}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # On an empty volume initdb.sh runs scripts/migrate.sh, then the demo seed.
      - ./scripts/initdb.sh:/docker-entrypoint-initdb.d/00_initdb.sh:ro
      - ./scripts/migrate.sh:/monicacafe/scripts/migrate.sh:ro
      - ./migrations:/monicacafe/migrations:ro
      - ./scripts/seed_dev.sql:/monicacafe/scripts/seed_dev.sql:ro
      - ./scripts/seed_reference.sql:/monicacafe/scripts/seed_reference.sql:ro
    ports:
      # Loopback only (#211): reachable from this machine's tools, never from
      # the network. Only nginx is published on every interface.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # Over TCP: during first-start initialisation Postgres listens on its
      # socket only, so this stays unhealthy until initdb.sh has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot, on every `docker compose up`: applies migrations the database
  # doesn't have yet (#209), so a volume created before a `git pull` catches up
  # instead of failing. The API starts only after it succeeds. A volume made
  # before schema_migrations existed needs MIGRATE_BASELINE once (see .env.example).
  migrate:
    image: postgres:17.11-alpine
    entrypoint: ["/bin/sh", "/monicacafe/scripts/migrate.sh"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-monica}:${POSTGRES_PASSWORD:-monica_secret}@postgres:5432/${POSTGRES_DB:-monicacafe}
      MIGRATIONS_DIR: /monicacafe/migrations
      MIGRATE_BASELINE: ${MIGRATE_BASELINE:-}
    volumes:
      - ./scripts/migrate.sh:/monicacafe/scripts/migrate.sh:ro
      - ./migrations:/monicacafe/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Reserved (cart / cache, Stage 2): no code reads it yet, so it only starts
  # with `docker compose --profile cache up`. The backend does not wait for it.
  redis:
    profiles: ["cache"]
    image: redis:7.4.12-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Reserved (Stage 3 search): nothing uses it yet, so it only starts with
  # `docker compose --profile search up`. Set MEILI_KEY first (see .env.example).
  meilisearch:
    profiles: ["search"]
    image: getmeili/meilisearch:v1.56
    environment:
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_MASTER_KEY: ${MEILI_KEY:-monica_meili_key}
    volumes:
      - meili_data:/meili_data
    healthcheck:
      # 127.0.0.1, not localhost: where /etc/hosts maps localhost to ::1 first
      # (GitHub runners), busybox wget doesn't fall back to IPv4 and Meilisearch
      # listens on 0.0.0.0 only.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7700/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # S3-compatible image storage (question #7: S3-compatible, any provider).
  # SeaweedFS stands in for MinIO, whose images left Docker Hub. Images are
  # uploaded with presigned PUTs and served through nginx at /media/.
  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    entrypoint: ["/bin/sh", "/seaweedfs.sh", "start"]
    environment:
      S3_BUCKET: ${S3_BUCKET:-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-monica_s3}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-monica_s3_secret}
    volumes:
      - seaweedfs_data:/data
      - ./scripts/seaweedfs.sh:/seaweedfs.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # One-shot: creates the bucket (idempotent).
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.53
    entrypoint: ["/bin/sh", "/seaweedfs.sh", "init"]
    environment:
      S3_BUCKET: ${S3_BUCKET:-media}
      SEAWEED_HOST: seaweedfs
    volumes:
      - ./scripts/seaweedfs.sh:/seaweedfs.sh:ro
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    environment:
      PORT: "4000"
      APP_ENV: ${APP_ENV:-development}
      LOCALE: ${LOCALE:-zh-TW}
      DATABASE_URL: postgres://${POSTGRES_USER:-monica}:${POSTGRES_PASSWORD:-monica_secret}@postgres:5432/${POSTGRES_DB:-monicacafe}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-in-prod}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-prod}
      TOKEN_PRUNE_INTERVAL: ${TOKEN_PRUNE_INTERVAL:-1h}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:-10s}
      # nginx and the Next.js BFF sit on the compose network (COMPOSE_SUBNET,
      # defined below); only their X-Forwarded-For is believed when limiting
      # requests per client IP. Not every private range: anything trusted can
      # claim any client address (#211).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.0/8,::1/128,${COMPOSE_SUBNET:-172.30.89.0/24}}
      RATE_LIMIT_LOGIN_IP: ${RATE_LIMIT_LOGIN_IP:-20/1m}
      RATE_LIMIT_LOGIN_EMAIL: ${RATE_LIMIT_LOGIN_EMAIL:-50/10m}
      RATE_LIMIT_LOGIN_EMAIL_IP: ${RATE_LIMIT_LOGIN_EMAIL_IP:-10/10m}
      RATE_LIMIT_REGISTER_IP: ${RATE_LIMIT_REGISTER_IP:-10/1h}
      RATE_LIMIT_REFRESH_IP: ${RATE_LIMIT_REFRESH_IP:-60/1m}
      RATE_LIMIT_COMMENT_USER: ${RATE_LIMIT_COMMENT_USER:-5/5m}
      RATE_LIMIT_UPLOAD_USER: ${RATE_LIMIT_UPLOAD_USER:-30/10m}
      UPLOAD_DAILY_BYTES_PER_SHOP: ${UPLOAD_DAILY_BYTES_PER_SHOP:-209715200}
      RATE_LIMIT_PASSWORD_USER: ${RATE_LIMIT_PASSWORD_USER:-5/15m}
      RATE_LIMIT_SAVE_USER: ${RATE_LIMIT_SAVE_USER:-60/5m}
      RATE_LIMIT_REPORT_USER: ${RATE_LIMIT_REPORT_USER:-10/1h}
      RATE_LIMIT_SELLER_WRITE_USER: ${RATE_LIMIT_SELLER_WRITE_USER:-60/5m}
      RATE_LIMIT_GRAPHQL_IP: ${RATE_LIMIT_GRAPHQL_IP:-600/1m}
      # Comma-separated. Browsers reach the API via nginx (http://localhost)
      # or `next dev` on :3000.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://localhost:3000}
      # Presigned upload URLs are signed for the host the browser uses (nginx),
      # which proxies /<bucket>/ to the S3 store.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://localhost:${HTTP_PORT:-80}}
      S3_BUCKET: ${S3_BUCKET:-media}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-monica_s3}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-monica_s3_secret}
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-}
      # The API lists / deletes objects itself (orphan cleanup) on the compose network.
      S3_INTERNAL_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-http://seaweedfs:8333}
      MEDIA_CLEANUP_INTERVAL: ${MEDIA_CLEANUP_INTERVAL:-6h}
      MEDIA_CLEANUP_MIN_AGE: ${MEDIA_CLEANUP_MIN_AGE:-24h}
      # Prometheus /metrics on its own port, reachable from the compose network
      # only: not published below and not routed by nginx (#221).
      METRICS_ADDR: ${METRICS_ADDR:-:9100}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    healthcheck:
      # Ready = Postgres answers and the schema is at the version this build
      # expects. 127.0.0.1, not localhost (busybox wget and IPv6, see meilisearch).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    expose:
      - "9100"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4000}:4000"
    restart: unless-stopped

  # Nightly encrypted pg_dump at 03:00 Asia/Taipei (#220), production only:
  # `docker compose --profile prod up -d`. Uploads to the BACKUP_S3_* bucket (or
  # to BACKUP_TARGET, a directory, kept in the backup_data volume). Runbook and
  # restore: docs/BACKUP.md. CI runs the same image for its restore drill.
  backup:
    profiles: ["prod"]
    build:
      context: ./scripts
      dockerfile: backup.Dockerfile
    command: ["sh", "/monicacafe/scripts/backup_loop.sh"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-monica}:${POSTGRES_PASSWORD:-monica_secret}@postgres:5432/${POSTGRES_DB:-monicacafe}
      MIGRATIONS_DIR: /monicacafe/migrations
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_RUN_NOW: ${BACKUP_RUN_NOW:-false}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_ALLOW_PLAINTEXT: ${BACKUP_ALLOW_PLAINTEXT:-false}
      BACKUP_TARGET: ${BACKUP_TARGET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-monicacafe/}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      # Only so backup.sh can refuse the media bucket as a backup target.
      S3_BUCKET: ${S3_BUCKET:-media}
    volumes:
      - ./scripts:/monicacafe/scripts:ro
      - ./migrations:/monicacafe/migrations:ro
      - backup_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      # No build args (#210): the browser calls /graphql on the page's origin.
    environment:
      # Only set when a CDN serves images from another origin (the CSP must
      # allow it); same value as the API's MEDIA_PUBLIC_URL. Read per request.
      MEDIA_URL: ${MEDIA_PUBLIC_URL:-}
      # Server components fetch over the compose network, not through nginx.
      GRAPHQL_URL_INTERNAL: http://backend:4000/graphql
      # Public origin for sitemap.xml / robots.txt.
      SITE_URL: ${SITE_URL:-http://localhost}
      # Server-side error reports (instrumentation.ts); empty = off (#221).
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped

  nginx:
    image: nginx:1.31.8-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
    ports:
      - "${HTTP_PORT:-80}:80"
    restart: unless-stopped

# A fixed subnet, so TRUSTED_PROXIES can name exactly the compose network.
# Change COMPOSE_SUBNET (and TRUSTED_PROXIES with it) if it clashes with a
# network on the host.
networks:
  default:
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-172.30.89.0/24}

volumes:
  postgres_data:
  redis_data:
  meili_data:
  seaweedfs_data:
  backup_data:
