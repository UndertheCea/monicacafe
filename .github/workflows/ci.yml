name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (go build / vet / test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: monica
          POSTGRES_PASSWORD: monica_secret
          POSTGRES_DB: monicacafe
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U monica -d monicacafe"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: monica_secret
      TEST_DATABASE_URL: postgres://monica:monica_secret@localhost:5432/monicacafe?sslmode=disable
      TEST_S3_ENDPOINT: http://localhost:8333
      TEST_S3_BUCKET: media
      TEST_S3_ACCESS_KEY: monica_s3
      TEST_S3_SECRET_KEY: monica_s3_secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # Same script compose runs (#209); its self-test covers a re-run, the
      # upgrade of a database made before schema_migrations, and a failing migration.
      - name: Apply migrations + demo seed
        working-directory: .
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" ./scripts/migrate.sh
          psql -v ON_ERROR_STOP=1 -h localhost -U monica -d monicacafe -f scripts/seed_dev.sql
      - name: Migration runner self-test
        working-directory: .
        run: DATABASE_URL="$TEST_DATABASE_URL" ./scripts/migrate_selftest.sh
      - name: Backup retention guard self-test
        working-directory: .
        run: ./scripts/backup_selftest.sh
      # Reference shops (#169): load the (dev-only) seed, run its self-test
      # (fixture coffees: matching, skips, the gap view), then remove it all and
      # check nothing is left before the integration tests use the database.
      - name: Reference-shop seed, self-test and removal
        working-directory: .
        run: |
          db="postgres://monica:monica_secret@localhost:5432/monicacafe"
          psql -v ON_ERROR_STOP=1 "$db" -f scripts/seed_reference.sql
          DATABASE_URL="$db" ./scripts/reference_gaps.sh --strict
          psql -v ON_ERROR_STOP=1 "$db" -f scripts/reference_selftest.sql
          DATABASE_URL="$db" ./scripts/reference_gaps.sh
          psql -v ON_ERROR_STOP=1 "$db" -f scripts/remove_reference_shops.sql
          left=$(psql "$db" -XAtc "SELECT (SELECT count(*) FROM users WHERE email LIKE 'reference+%') + (SELECT count(*) FROM shops WHERE slug LIKE 'ref-%') + (to_regclass('reference_catalogue') IS NOT NULL)::int")
          test "$left" = "0" || { echo "remove_reference_shops.sql left $left things behind"; exit 1; }
      # Same image + script as docker-compose.yml, so the upload integration
      # test PUTs a real file with a presigned URL and reads it back anonymously.
      - name: Start SeaweedFS (S3) + create the image bucket
        working-directory: .
        run: |
          docker run -d --name seaweedfs -p 8333:8333 \
            -e S3_BUCKET=media -e S3_ACCESS_KEY=monica_s3 -e S3_SECRET_KEY=monica_s3_secret \
            -v "$PWD/scripts/seaweedfs.sh:/seaweedfs.sh:ro" \
            --entrypoint /bin/sh chrislusf/seaweedfs:4.53 /seaweedfs.sh start
          for i in $(seq 60); do curl -sf http://localhost:8333/healthz >/dev/null && break; sleep 1; done
          docker exec -e S3_BUCKET=media -e SEAWEED_HOST=localhost seaweedfs /bin/sh /seaweedfs.sh init
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go build ./...
      - run: go vet ./...
      - name: go test (unit + integration)
        run: go test -race -count=1 ./...
      - name: SeaweedFS logs (on failure)
        if: failure()
        run: docker logs seaweedfs 2>&1 | tail -100

  frontend:
    name: Frontend (npm ci / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Same install command as frontend/Dockerfile, so a stale lockfile fails here first.
      # Plain `npm ci` (no --legacy-peer-deps): verified in #216 that the peer tree resolves.
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build

  security:
    name: Security (govulncheck + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # Fails when a known vulnerability is reachable from our code (Go stdlib or modules).
      - name: govulncheck
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Production dependencies only; high and critical advisories fail the build.
      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev
      - name: npm audit (e2e)
        working-directory: e2e
        run: npm audit --audit-level=high --omit=dev

  compose:
    name: compose config + docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cp .env.example .env && docker compose config --quiet && docker compose --profile prod --profile cache --profile search --profile worker config --quiet
      - name: Project brief stays short and structured
        run: ./scripts/check_brief.sh

  stack:
    name: Full stack (docker compose up + smoke.sh through nginx)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and start every service
        run: |
          cp .env.example .env
          sed -i "s/^SEED_REFERENCE_SHOPS=.*/SEED_REFERENCE_SHOPS=true/" .env  # dev-only reference shops (#169)
          # Smoke + the browser checks register ~10 accounts from one address, the
          # whole default budget (10/1h); leave room for more tests (#505).
          sed -i "s|^RATE_LIMIT_REGISTER_IP=.*|RATE_LIMIT_REGISTER_IP=100/1h|" .env
          grep -q '^RATE_LIMIT_REGISTER_IP=100/1h$' .env || { echo "RATE_LIMIT_REGISTER_IP not set in .env"; exit 1; }
          docker compose up --build -d --wait --wait-timeout 300
      - name: Smoke test via http://localhost
        run: ./scripts/smoke.sh
      # Browser journeys (#263): seller publishes a coffee with a photo, a buyer
      # saves / follows / comments, pages render without JavaScript; axe on 13
      # public and signed-in pages fails on serious / critical violations (#264);
      # a reported comment reaches /admin and is taken down (#265).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Browser checks (Playwright journeys + axe)
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          BASE_URL=http://localhost npm test
        env:
          # The moderation check (#265) grants its admin the only way there is: cmd/admin.
          E2E_GRANT_ADMIN: docker compose --project-directory .. exec -T backend /app/admin grant
      # Also on success: gotoUntilShown's stale-* screenshots come from runs that
      # retried and passed (#504, #506).
      - name: Browser check screenshots
        if: always() && hashFiles('e2e/artifacts/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: e2e/artifacts/
          if-no-files-found: ignore
      # The migrate service runs on every start: running it again must find the
      # database up to date.
      - name: Migrations re-run on an existing volume
        run: |
          out=$(docker compose run --rm migrate 2>&1); echo "$out"
          grep -q "up to date" <<<"$out" || { echo "migrate didn't report up to date"; exit 1; }
      # Restore drill (#220, #289): the real path. An age key made for this run, a
      # dump into the dev SeaweedFS (a second bucket, so not the media one) through
      # the same image the `backup` service uses (pg_dump 17, age, aws-cli): upload,
      # list, retention by date and the success marker are checked
      # (scripts/backup_drill.sh), then the database is wiped, the dump is fetched,
      # decrypted and restored with restore.sh, and smoke runs again.
      - name: Backup (age + S3), wipe and restore the database, then smoke again
        run: |
          keys=$(docker compose run --rm --no-deps -T backup age-keygen)
          recipient=$(echo "$keys" | grep -o 'age1[a-z0-9]*' | head -n 1)
          secret=$(echo "$keys" | grep -o 'AGE-SECRET-KEY-[A-Z0-9]*' | head -n 1)
          [ -n "$recipient" ] && [ -n "$secret" ] || { echo "age-keygen gave no key"; exit 1; }
          s3_key=$(grep '^S3_ACCESS_KEY=' .env | cut -d= -f2)
          s3_secret=$(grep '^S3_SECRET_KEY=' .env | cut -d= -f2)
          docker compose run --rm --no-deps -e S3_BUCKET=backups seaweedfs-init
          drill() {
            docker compose run --rm --no-deps -T \
              -e BACKUP_TARGET= -e BACKUP_ALLOW_PLAINTEXT=false \
              -e BACKUP_S3_ENDPOINT=http://seaweedfs:8333 -e BACKUP_S3_BUCKET=backups \
              -e BACKUP_S3_ACCESS_KEY="$s3_key" -e BACKUP_S3_SECRET_KEY="$s3_secret" \
              -e BACKUP_AGE_RECIPIENT="$recipient" -e AGE_SECRET_KEY="$secret" \
              backup sh /monicacafe/scripts/backup_drill.sh "$1"
          }
          drill backup
          docker compose stop nginx frontend backend
          docker compose exec -T postgres sh -c 'psql -X -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"'
          drill restore
          docker compose up -d --wait --wait-timeout 300
          ./scripts/smoke.sh
      # Image backup drill (#288): mirror the media bucket, delete one image from
      # the bucket, check nginx now answers 404 (and tells caches not to keep it),
      # restore the images from the backup and check the image is served again.
      - name: Back up images, lose one, restore it
        run: |
          run_backup() {
            docker compose run --rm -T --no-deps -e BACKUP_TARGET=/backups -e BACKUP_ALLOW_PLAINTEXT=true \
              -e BACKUP_MEDIA=true backup sh -c "$1"
          }
          out=$(run_backup 'sh /monicacafe/scripts/backup.sh' | tr -d '\r'); echo "$out"
          objects=$(tail -n 1 <<<"$out" | grep -o '"media_objects":[0-9]*' | cut -d: -f2)
          [ "${objects:-0}" -gt 0 ] || { echo "the backup mirrored no images"; exit 1; }
          key=$(run_backup 'sh /monicacafe/scripts/media_drill.sh' | tail -n 1 | tr -d '\r')
          [ -n "$key" ] || { echo "no image was removed"; exit 1; }
          echo "removed $key from the bucket"
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost/media/$key")
          [ "$code" = 404 ] || { echo "GET /media/$key → $code after removing it, want 404"; exit 1; }
          run_backup 'sh /monicacafe/scripts/restore_media.sh /backups/media'
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost/media/$key")
          [ "$code" = 200 ] || { echo "GET /media/$key → $code after restoring the images, want 200"; exit 1; }
          echo "ok   image $key restored from the backup"
      - name: Reference-shop gap report
        run: ./scripts/reference_gaps.sh
      # The River worker (profile `worker`) runs as its own container in
      # production; start it the same way and wait for its healthcheck, so a
      # broken command, image, env or read-only fs fails here (#572). Last,
      # so its jobs can't race the browser checks.
      - name: Worker container starts and turns healthy
        run: |
          docker compose --profile worker up -d --no-deps --wait --wait-timeout 120 worker
          docker compose --profile worker ps worker
      - name: Service status and logs (on failure)
        if: failure()
        run: |
          docker compose --profile worker ps -a
          docker compose --profile worker logs --tail=80
      # The whole run's container logs, timestamped, one file per service (#504):
      # the last 80 lines above start after the failure, so a flaky browser step's
      # requests are lost without these.
      - name: Save full container logs (on failure)
        if: failure()
        run: |
          mkdir -p stack-logs
          docker compose --profile worker ps -a > stack-logs/ps.txt 2>&1 || true
          for svc in $(docker compose --profile worker config --services); do
            docker compose --profile worker logs --no-color --timestamps "$svc" > "stack-logs/$svc.log" 2>&1 || true
          done
      - name: Upload container logs (on failure)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stack-logs
          path: stack-logs/
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: docker compose --profile worker down -v
