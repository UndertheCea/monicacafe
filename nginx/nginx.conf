events {
  worker_connections 1024;
}

http {
  # Don't advertise the nginx version (Server header, error pages).
  server_tokens off;

  # Compress text responses: pages, Next's JS / CSS, GraphQL JSON, sitemap XML,
  # SVG. Images (JPEG / PNG / WebP) are already compressed and left alone.
  # gzip_proxied any: every response here is proxied. Vary: Accept-Encoding
  # keeps shared caches from serving gzip to clients that didn't ask for it.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/graphql-response+json
    application/xml application/rss+xml application/manifest+json
    image/svg+xml;

  # One JSON object per request, like the API's slog output. request_id is the
  # id forwarded to both upstreams as X-Request-ID, which the API logs too.
  log_format json escape=json
    '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"bytes_sent":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time","host":"$host",'
    '"referer":"$http_referer","user_agent":"$http_user_agent"}';
  access_log /dev/stdout json;

  # Per-client request limits (#214), keyed by address. A rejected request
  # gets a plain 429; the frontend shows its normal rate-limit message.
  limit_req_zone $binary_remote_addr zone=graphql:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
  limit_req_status 429;
  limit_req_log_level warn;

  # Slow-client protection (proxy_read_timeout is set per API location).
  client_header_timeout 10s;
  client_body_timeout 10s;
  # Default for the API; /media/ raises it for uploads (capped at 5 MiB).
  client_max_body_size 1m;

  # Only GET / HEAD responses from the media store are cacheable. An empty
  # value makes add_header omit the header (PUT responses, for one).
  map $request_method $media_cache_control {
    GET     "public, max-age=31536000, immutable";
    HEAD    "public, max-age=31536000, immutable";
    default "";
  }

  upstream frontend {
    server frontend:3000;
  }

  upstream backend {
    server backend:4000;
  }

  upstream media {
    server seaweedfs:8333;
  }

  server {
    listen 80;
    server_name localhost;

    # Next.js frontend
    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_cache_bypass $http_upgrade;
    }

    # Next's hashed build output never changes under the same URL. Next sends
    # its own Cache-Control; replace it rather than send two.
    location /_next/static/ {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_hide_header Cache-Control;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Auth backend-for-frontend (Next route handlers), limited harder than the API.
    location /api/ {
      limit_req zone=auth burst=10 nodelay;
      client_max_body_size 1m;
      proxy_read_timeout 30s;
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
    }

    # GraphQL API. Exact match: nothing else under /graphql* reaches the
    # backend. /playground is not proxied here; outside production the backend
    # still serves it on its own loopback port (127.0.0.1:${BACKEND_PORT:-4000}).
    location = /graphql {
      limit_req zone=graphql burst=40 nodelay;
      client_max_body_size 1m;
      proxy_read_timeout 30s;
      proxy_pass http://backend/graphql;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
    }

    # Uploaded images (S3 bucket "media" = S3_BUCKET, on SeaweedFS). The path is passed
    # through unchanged (/media/<key> → bucket/key) and Host is kept as the
    # browser sent it, because presigned PUTs are signed for that host + path.
    # GETs of shops/ and coffees/ are public; PUTs need a presigned URL.
    # Uploaded files are untrusted: only GET / HEAD / PUT get through, and
    # every response is sandboxed with nothing allowed to load or run, so an
    # HTML / SVG upload opened directly can't script the site's origin.
    # (A location's add_header replaces any inherited ones, so all are listed.)
    location /media/ {
      limit_except GET HEAD PUT {
        deny all;
      }
      proxy_pass http://media;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_request_buffering off;
      client_max_body_size 6m;
      add_header Content-Security-Policy "default-src 'none'; sandbox" always;
      add_header X-Content-Type-Options nosniff always;
      add_header Cache-Control $media_cache_control always;
    }

    # Health checks: /health (alias), /health/live, /health/ready (#221). Public
    # on purpose, for an external uptime check; the body names checks, never
    # error text. /metrics is NOT proxied: it lives on the backend's internal
    # port (METRICS_ADDR), reachable on the compose network only.
    location /health {
      proxy_pass http://backend;
      proxy_set_header X-Request-ID $request_id;
    }
  }
}
