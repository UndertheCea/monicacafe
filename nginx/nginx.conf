events {
  worker_connections 1024;
}

http {
  # Don't advertise the nginx version (Server header, error pages).
  server_tokens off;

  # Compress text responses: pages, Next's JS / CSS, GraphQL JSON, sitemap XML,
  # SVG. Images (JPEG / PNG / WebP) are already compressed and left alone.
  # gzip_proxied any: every response here is proxied. Vary: Accept-Encoding
  # keeps shared caches from serving gzip to clients that didn't ask for it.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/graphql-response+json
    application/xml application/rss+xml application/manifest+json
    image/svg+xml;
  upstream frontend {
    server frontend:3000;
  }

  upstream backend {
    server backend:4000;
  }

  upstream media {
    server seaweedfs:8333;
  }

  server {
    listen 80;
    server_name localhost;

    # Next.js frontend
    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }

    # GraphQL API
    location /graphql {
      proxy_pass http://backend/graphql;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GraphQL Playground (dev only)
    location /playground {
      proxy_pass http://backend/playground;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    # Uploaded images (S3 bucket "media" = S3_BUCKET, on SeaweedFS). The path is passed
    # through unchanged (/media/<key> → bucket/key) and Host is kept as the
    # browser sent it, because presigned PUTs are signed for that host + path.
    # GETs of shops/ and coffees/ are public; PUTs need a presigned URL.
    location /media/ {
      proxy_pass http://media;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_request_buffering off;
      client_max_body_size 6m;
      # Uploaded files are never rendered as anything but images.
      add_header X-Content-Type-Options nosniff always;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Health check
    location /health {
      proxy_pass http://backend/health;
    }
  }
}
