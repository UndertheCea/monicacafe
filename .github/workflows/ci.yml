name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (go build / vet / test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: monica
          POSTGRES_PASSWORD: monica_secret
          POSTGRES_DB: monicacafe
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U monica -d monicacafe"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: monica_secret
      TEST_DATABASE_URL: postgres://monica:monica_secret@localhost:5432/monicacafe?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Apply migrations + demo seed
        working-directory: .
        run: |
          for f in migrations/*.sql scripts/seed_dev.sql; do
            echo "→ $f"
            psql -v ON_ERROR_STOP=1 -h localhost -U monica -d monicacafe -f "$f"
          done
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go build ./...
      - run: go vet ./...
      - name: go test (unit + integration)
        run: go test -race -count=1 ./...

  frontend:
    name: Frontend (npm ci / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Same install command as frontend/Dockerfile, so a stale lockfile fails here first.
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npm run build

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config --quiet
